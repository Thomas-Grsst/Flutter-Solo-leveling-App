name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Fixed key so each new APK installs as an update over the previous one.
      - run: |
          cat > android/key.properties <<'PROPS'
          storeFile=ascend-release.jks
          storePassword=ascend-sideload
          keyAlias=ascend
          keyPassword=ascend-sideload
          PROPS
      - name: flutter build apk
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log || {
            # Surface the Gradle error as annotations, readable without the raw logs.
            grep -E -A12 'What went wrong|error:|e: |FAILURE' build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: mv build/app/outputs/flutter-apk/app-release.apk ascend.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ascend (dernière version)
          body: |
            APK Android de la dernière version de `main` (commit ${{ github.sha }}).
            Sur le téléphone : téléchargez `ascend.apk`, ouvrez-le et autorisez l'installation depuis cette source.
          prerelease: false
          make_latest: true
          files: ascend.apk
