name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk ascend.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ascend (dernière version)
          body: |
            APK Android de la dernière version de `main` (commit ${{ github.sha }}).
            Sur le téléphone : téléchargez `ascend.apk`, ouvrez-le et autorisez l'installation depuis cette source.
          prerelease: false
          make_latest: true
          files: ascend.apk
